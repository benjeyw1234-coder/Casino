plinko:
  # 9 Fächer von links nach rechts (Gesamtauszahlung inkl. Einsatz)
  multipliers: [10, 3, 1.5, 0.6, 0.2, 0.6, 1.5, 3, 10]

wheel:
  # genau 20 Felder im Uhrzeigersinn (Gesamtauszahlung inkl. Einsatz, 0 = Niete)
